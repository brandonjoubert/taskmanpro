<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskman Pro - {% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <style>
        .table td {
            overflow-wrap: break-word;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">Taskman Pro</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('task_list') }}">Tasks</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('add_task') }}">Add Task</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('completed_tasks') }}">Completed</a></li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('shutdown') }}" onclick="return confirm('Are you sure you want to shut down the application?');">
                            <i class="bi bi-power"></i> Shutdown
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container mt-4 flex-grow-1 {% if is_home %}d-flex align-items-center{% endif %}">
        {% if is_home %}
        <div class="w-100">
        {% endif %}

            {% block content %}{% endblock %}

        {% if is_home %}
        </div>
        {% endif %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
