{% extends "base.html" %}
{% block title %}Edit Task - {{ task.title }}{% endblock %}
{% block content %}
    <h1>Edit Task: "{{ task.title }}"</h1>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Task Name</label>
            <input type="text" name="title" class="form-control" value="{{ task.title }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Due Date</label>
            <input type="date" name="start_date" class="form-control" value="{{ task.start_date.strftime('%Y-%m-%d') }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Notes</label>
            <textarea name="description" class="form-control" rows="5">{{ task.description or '' }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('task_list') }}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
