{% extends "base.html" %}
{% block title %}Completed Tasks{% endblock %}
{% block content %}
    <h1>Completed Tasks</h1>
    <table class="table">
        <thead>
            <tr>
                <th>Task Title</th>
                <th>Completion Date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for completion in completions %}
                <tr>
                    <td>{{ completion.task.title }}</td>
                    <td>{{ completion.completion_date }}</td>
                    <td>
                        <a href="{{ url_for('delete_completion', completion_id=completion.id) }}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this completion record?');">
                            <i class="bi bi-trash"></i>
                        </a>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
